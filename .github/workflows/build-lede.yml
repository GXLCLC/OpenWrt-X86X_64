name: Build LEDE X86_64 Squashfs

on:
  workflow_dispatch:   # 仅手动触发，无任何自动触发器

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/X86_64.config
  CUSTOM_SCRIPT: scripts/custom.sh
  VERIFY_SCRIPT: scripts/verify_firmware.sh

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装 Ubuntu 24.04 编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib \
            gettext genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz \
            msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev

      - name: 校验第三方源连通性与分支
        run: |
          set -e
          for repo in \
            https://github.com/coolsnowwolf/lede \
            https://github.com/kenzok8/openwrt-packages \
            https://github.com/kenzok8/small-package \
            https://github.com/EasyTier/luci-app-easytier; do
            echo ">>> 检查 $repo"
            git ls-remote "$repo" HEAD >/dev/null || { echo "ERROR: 无法连接 $repo"; exit 1; }
          done

      - name: 克隆 Lean LEDE master 分支
        run: git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" lede

      - name: 注入 feeds 源（kenzok8 补充源）
        working-directory: lede
        run: |
          sed -i '$a src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          sed -i '$a src-git small https://github.com/kenzok8/small-package' feeds.conf.default

      - name: 更新并安装全部 feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 浅克隆 EasyTier 并复制 luci-app-easytier
        run: |
          set -e
          git clone --depth=1 https://github.com/EasyTier/luci-app-easytier.git /tmp/easytier
          [ -d /tmp/easytier/luci-app-easytier ] || { echo "ERROR: easytier 目录不完整"; exit 1; }
          cp -r /tmp/easytier/luci-app-easytier lede/package/

      - name: 复制 X86_64 配置并执行 defconfig
        working-directory: lede
        run: |
          cp "../$CONFIG_FILE" .config
          make defconfig

      - name: 执行自定义脚本（密码/主机名/时区/主题/i18n 配套）
        working-directory: lede
        run: bash "../$CUSTOM_SCRIPT"

      - name: 提取内核版本供 Release 使用
        run: |
          K_VER=$(grep -E '^LINUX_VERSION-' lede/include/kernel-version.mk | awk -F'-' '{print $3}' | head -n 1)
          echo "KERNEL_VERSION=${K_VER:-5.4}" >> $GITHUB_ENV

      - name: DL 缓存
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: lede-dl-${{ hashFiles('config/X86_64.config') }}-${{ github.run_id }}
          restore-keys: |
            lede-dl-${{ hashFiles('config/X86_64.config') }}-

      - name: 下载源码包
        working-directory: lede
        run: make download -j$(nproc)

      - name: 严格编译（任意包失败立即终止）
        working-directory: lede
        run: |
          set -euo pipefail
          make -j1 V=s 2>&1 | tee build.log

      - name: 固件校验（文件/格式/2G分区）
        working-directory: lede
        run: bash "../$VERIFY_SCRIPT"

      - name: 整理发布产物（加时间前缀）
        run: |
          set -e
          mkdir -p release
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          find lede/bin/targets/x86/64 -maxdepth 1 -name "*squashfs*combined*.img.gz" | while read f; do
            base=$(basename "$f")
            cp "$f" "release/${TIMESTAMP}-${base}"
          done
          ls -lh release/
          [ "$(ls -A release)" ] || { echo "ERROR: 未生成目标 img.gz"; exit 1; }

      - name: 编译失败上传完整日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            lede/build.log
            lede/.config
            lede/logs/
          if-no-files-found: warn

      - name: 发布 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TIMESTAMP }}
          name: LEDE-X86_64-${{ env.TIMESTAMP }}
          body: |
            **默认后台**：192.168.2.1  
            **默认密码**：12345678  
            **内核版本**：`${{ env.KERNEL_VERSION }}`  
            **固件版本**：${{ env.TIMESTAMP }}  

            ### 已集成插件（纯净版，不含 kmod）
            luci-app-smartdns, luci-app-ddnsto (中文), luci-app-adguardhome (含核心),
