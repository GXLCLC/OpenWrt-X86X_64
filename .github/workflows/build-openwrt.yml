name: Build ImmortalWrt X86_64

# 触发方式：仅手动触发（workflow_dispatch）
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release 标签名（留空则自动生成 日期+时分）"
        required: false
        default: ""
      clean_build:
        description: "是否清理后全量编译（耗时更长，默认否）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  # ImmortalWrt 源码仓库与分支
  OPENWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  OPENWRT_BRANCH: openwrt-24.10
  # 编译输出目录
  IMAGE_DIR: openwrt/bin/targets/x86/64

jobs:
  build:
    name: 编译 ImmortalWrt X86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:
      # ---------------------------------------------------------------------
      # 1. 检出本仓库
      # ---------------------------------------------------------------------
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # 2. 初始化编译环境（安装依赖，清理多余软件以腾出磁盘空间）
      #    ubuntu-24.04 runner 预装了大量用不到的组件，需卸载以获取 ~40GB 空间
      # ---------------------------------------------------------------------
      - name: 初始化编译环境
        run: |
          echo "===== 清理 runner 预装软件，释放磁盘空间 ====="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get -y purge azure-cli google-cloud-sdk microsoft-edge-stable \
              firefox powershell || true
          sudo apt-get -y autoremove || true
          sudo apt-get -y clean || true
          df -h /

          echo "===== 安装编译依赖 ====="
          sudo apt-get -y update
          sudo apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            git gperf haveged help2man intltool jq lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs ninja-build nlohmann-json3-dev p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

          echo "===== 磁盘空间 ====="
          df -h /

      # ---------------------------------------------------------------------
      # 3. 克隆 ImmortalWrt 源码（浅克隆，指定 openwrt-24.10 分支）
      # ---------------------------------------------------------------------
      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth=1 --single-branch --branch "$OPENWRT_BRANCH" \
            "$OPENWRT_REPO" openwrt
          cd openwrt
          git rev-parse HEAD

      # ---------------------------------------------------------------------
      # 4. 更新第三方插件 feeds（kenzok8/EasyTier/DDNSTO/OAF/TurboAcc）
      #    任一仓库拉取失败立即终止，避免产出缺插件的固件
      # ---------------------------------------------------------------------
      - name: 更新第三方插件 feeds
        run: |
          chmod +x scripts/feeds_update.sh
          bash scripts/feeds_update.sh openwrt

      # ---------------------------------------------------------------------
      # 5. 写入构建配置（X86_64.config → .config）
      # ---------------------------------------------------------------------
      - name: 写入构建配置
        run: |
          cp config/X86_64.config openwrt/.config
          echo "===== 已写入 .config，插件条目统计 ====="
          grep -c 'CONFIG_PACKAGE_' openwrt/.config

      # ---------------------------------------------------------------------
      # 6. 应用系统默认设置（IP/密码/时区/主题/语言/主机名）
      # ---------------------------------------------------------------------
      - name: 应用系统默认设置
        run: |
          chmod +x scripts/system-config.sh
          bash scripts/system-config.sh openwrt

      # ---------------------------------------------------------------------
      # 7. 预下载源码包（make download）
      #    失败时自动重试 3 次，规避 GitHub 下载源限流
      # ---------------------------------------------------------------------
      - name: 预下载源码包
        working-directory: openwrt
        run: |
          for i in 1 2 3; do
            echo "===== make download 第 $i 次尝试 ====="
            if make download -j$(nproc); then
              echo "下载完成"
              break
            fi
            if [ "$i" = "3" ]; then
              echo "===== make download 连续失败 ====="
              exit 1
            fi
            echo "下载失败，30 秒后重试..."
            sleep 30
          done

      # ---------------------------------------------------------------------
      # 8. 编译固件
      #    配置 ccache 加速重复编译；失败时输出日志尾部便于定位
      # ---------------------------------------------------------------------
      - name: 编译固件
        working-directory: openwrt
        run: |
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            echo "===== 用户选择全量编译，清理构建产物 ====="
            rm -rf build_dir/target-* staging_dir/target-*
          fi

          echo "===== 开始编译 ====="
          if ! make -j$(nproc) V=s; then
            echo "=============================================================="
            echo "编译失败，最后 200 行日志："
            echo "=============================================================="
            find logs -name '*.txt' 2>/dev/null | while read -r f; do
              echo "----- $f -----"
              tail -n 200 "$f"
            done
            exit 1
          fi

          echo "===== 编译完成，产物清单 ====="
          ls -lh bin/targets/x86/64/

      # ---------------------------------------------------------------------
      # 9. 生成固件信息与校验文件
      # ---------------------------------------------------------------------
      - name: 生成固件信息
        run: |
          chmod +x scripts/firmware-info.sh
          bash scripts/firmware-info.sh openwrt config/X86_64.config release_info

      # ---------------------------------------------------------------------
      # 10. 上传构建产物（Artifact，保留 7 天）
      #     便于在 Release 发布前预览/下载测试
      # ---------------------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-firmware
          path: |
            openwrt/bin/targets/x86/64/squashfs-combined.img
            openwrt/bin/targets/x86/64/*.manifest
            release_info/**
          retention-days: 7
          if-no-files-found: error

      # ---------------------------------------------------------------------
      # 11. 发布 Release
      #     标签名：用户输入，缺省为 日期+时分
      #     固件内容：squashfs-combined.img + sha256 + release_info.md
      # ---------------------------------------------------------------------
      - name: 计算 Release 标签
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="build-$(TZ=Asia/Shanghai date '+%Y%m%d-%H%M')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "===== Release 标签: $TAG ====="

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ImmortalWrt X86_64 ${{ steps.release_tag.outputs.tag }}
          body_path: release_info/release_info.md
          draft: false
          prerelease: false
          files: |
            openwrt/bin/targets/x86/64/squashfs-combined.img
            release_info/squashfs-combined.img.sha256
            release_info/release_info.md
          fail_on_unmatched_files: true

      # ---------------------------------------------------------------------
      # 12. 输出结果摘要
      # ---------------------------------------------------------------------
      - name: 构建结果摘要
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "- ImmortalWrt 版本: $(grep -oP 'VERSION_NUMBER:=\s*\K[^\s]+' openwrt/include/version.mk || echo '未知')"
            echo "- 固件文件: squashfs-combined.img"
            echo "- Release 标签: ${{ steps.release_tag.outputs.tag }}"
            echo ""
            echo "### 默认设置"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 管理地址 | http://192.168.2.1 |"
            echo "| 登录密码 | 12345678 |"
            echo "| 时区 | Asia/Shanghai |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
